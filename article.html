<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>News | Principality of Vithuanum</title>

    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/jpeg" href="favicon.jpg">

    <style>

        .article-page {
            background: #ffffff;
            padding: 70px 6% 100px;
        }

        .article-container {
            max-width: 850px;
            margin: 0 auto;
        }

        .article-label {
            display: inline-block;
            background: #005ea8;
            color: white;
            font-size: 12px;
            font-weight: 700;
            padding: 5px 9px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 20px;
        }

        .article-container h1 {
            font-size: 46px;
            line-height: 1.15;
            color: #0b1f33;
            margin: 0 0 15px;
        }

        .article-date {
            color: #555;
            font-size: 14px;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 1px solid #ddd;
        }

        .article-content {
            font-size: 18px;
            line-height: 1.75;
            color: #222;
        }

        .article-content p {
            margin-bottom: 25px;
        }

        .back-link {
            display: inline-block;
            margin-top: 35px;
            color: #005ea8;
            font-weight: 700;
            text-decoration: underline;
        }

        @media (max-width: 600px) {

            .article-page {
                padding: 45px 20px 70px;
            }

            .article-container h1 {
                font-size: 34px;
            }

            .article-content {
                font-size: 17px;
            }

        }

    </style>

</head>

<body>


<header class="government-header">

    <button
        class="menu-button"
        onclick="toggleMenu()"
        aria-label="Open navigation menu">
        ☰
    </button>

    <div class="government-brand">

        <img
            src="coat-of-arms.png"
            alt="Coat of Arms of Vithuanum">

        <div>
            <strong>PRINCIPALITY OF VITHUANUM</strong>
            <span>Official Government Website</span>
        </div>

    </div>

</header>


<nav id="side-menu" class="side-menu">

    <div class="menu-header">

        <strong>VITHUANUM</strong>

        <button
            onclick="toggleMenu()"
            aria-label="Close navigation menu">
            ×
        </button>

    </div>

    <a href="index.html">Home</a>
    <a href="government.html">Government</a>
    <a href="history.html">History</a>
    <a href="territory.html">Territory</a>
    <a href="citizenship.html">Citizenship</a>
    <a href="constitution.html">Constitution</a>
    <a href="national-symbols.html">National Symbols</a>
    <a href="news.html">News</a>

</nav>


<div
    id="menu-overlay"
    class="menu-overlay"
    onclick="toggleMenu()">
</div>


<main>

    <section class="article-page">

        <div class="article-container">

            <span id="article-label" class="article-label">
                News
            </span>

            <h1 id="article-title">
                Loading article...
            </h1>

            <div id="article-date" class="article-date"></div>

            <div id="article-content" class="article-content">
            </div>

            <a
                href="news.html"
                class="back-link">
                ← Back to News
            </a>

        </div>

    </section>

</main>


<footer>

    <strong>
        Principality of Vithuanum
    </strong>

    <p>
        Official Government Website
    </p>

    <p>
        © Principality of Vithuanum
    </p>

</footer>


<script src="script.js"></script>


<script>

const articles = {

    government: {
        label: "Government",
        title: "Government of Vithuanum announces new national programme",
        date: "3 September 2026",
        content: `
            <p>
                The Government of Vithuanum has announced a new national
                programme supporting the continued development of the
                Principality and its national institutions.
            </p>

            <p>
                Further information about the programme will be published
                by the Government as its implementation progresses.
            </p>
        `
    },


    development: {
        label: "National",
        title: "Vithuanum celebrates continued national development",
        date: "1 September 2026",
        content: `
            <p>
                The Principality of Vithuanum continues to develop its
                national institutions, community and government structures.
            </p>

            <p>
                The Government remains committed to the continued
                development of the Principality.
            </p>
        `
    },


    website: {
        label: "Announcement",
        title: "New updates published on the Government website",
        date: "28 August 2026",
        content: `
            <p>
                New information and updates have been published across
                the official Government website of Vithuanum.
            </p>

            <p>
                Citizens and visitors can use the website to access
                information about the Principality and its institutions.
            </p>
        `
    },


    citizenship: {
        label: "Citizenship",
        title: "Citizenship applications remain open",
        date: "25 August 2026",
        content: `
            <p>
                Applications for citizenship in the Principality of
                Vithuanum remain available to eligible visitors.
            </p>

            <p>
                Applicants can find further information and access the
                citizenship application through the Citizenship page.
            </p>
        `
    },


    institutions: {
        label: "Government",
        title: "Government institutions continue to expand",
        date: "20 August 2026",
        content: `
            <p>
                Further work is underway to develop the institutions
                and administrative structure of Vithuanum.
            </p>

            <p>
                The development of national institutions will continue
                as the Principality grows.
            </p>
        `
    },


    national: {
        label: "National",
        title: "Vithuanum publishes national update",
        date: "15 August 2026",
        content: `
            <p>
                The Principality has published an update concerning
                recent national developments and future plans.
            </p>
        `
    },


    announcements: {
        label: "Announcement",
        title: "Official Government announcements",
        date: "10 August 2026",
        content: `
            <p>
                The Government of the Principality of Vithuanum has
                published its latest official announcements.
            </p>

            <p>
                Further announcements will be published through the
                official News section.
            </p>
        `
    },


    latest: {
        label: "Vithuanum",
        title: "The latest from the Principality",
        date: "5 August 2026",
        content: `
            <p>
                This article provides the latest developments,
                announcements and information from across Vithuanum.
            </p>
        `
    }

};


const parameters =
    new URLSearchParams(window.location.search);

const articleID =
    parameters.get("article");

const article =
    articles[articleID];


if (article) {

    document.title =
        article.title + " | Principality of Vithuanum";

    document.getElementById("article-label").textContent =
        article.label;

    document.getElementById("article-title").textContent =
        article.title;

    document.getElementById("article-date").textContent =
        article.date;

    document.getElementById("article-content").innerHTML =
        article.content;

} else {

    document.getElementById("article-title").textContent =
        "Article not found";

    document.getElementById("article-date").textContent =
        "";

    document.getElementById("article-content").innerHTML = `
        <p>
            The requested news article could not be found.
        </p>
    `;

}

</script>

</body>

</html>
